<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
  <style>
    body {
      background-color: #ffe6f2;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
    }
    h1 {
      color: #ff1493;
      font-size: 48px;
    }
    p {
      font-size: 20px;
      color: #555;
    }
    button {
      background-color: white;
      border: 3px solid #ff1493;
      color: #ff1493;
      font-size: 22px;
      padding: 15px 25px;
      margin: 10px;
      border-radius: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff1493;
      color: white;
    }
    #result {
      color: #333;
      margin-top: 30px;
    }
    #score {
      color: #ff1493;
      background: white;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <h1>Rock Paper Scissors! 💖</h1>
  <p>Click one to play!</p>

  <button onclick="play('rock')">✊ Rock</button>
  <button onclick="play('paper')">✋ Paper</button>
  <button onclick="play('scissors')">✌️ Scissors</button>

  <h2 id="result">Choose one!</h2>
  <h2 id="score">You: 0 - Computer: 0</h2>

  <script src="script.js"></script>
</body>
</html>
